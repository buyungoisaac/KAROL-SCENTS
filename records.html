<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAROL'S SCENTS - Records</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="records.css">
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">🧴✨🌸</div>
      <a href="dashboard.html" style="text-decoration: none;"><div class="nav-item">🏠</div></a>
      <a href="pos.html" style="text-decoration: none;"><div class="nav-item">🛒</div></a>
      <div class="nav-item active">📋</div>
      <div class="nav-item">💬</div>
      <a href="receipts.html" style="text-decoration: none;"><div class="nav-item" id="nav-receipts">🧾</div></a>
      <a href="team.html" style="text-decoration: none;"><div class="nav-item" id="nav-team">👥</div></a>
      <a href="records.html" style="text-decoration: none;"><div class="nav-item" id="nav-records">📋</div></a>
    </div>

    <!-- Main content -->
    <div class="main">

      <div class="topbar">
        <h2>Patient Records</h2>
     <div class="profile-menu">
  <div class="profile-trigger" id="profileTrigger">
    <div class="avatar">👤</div>
    <span id="userNameDisplay"></span>
    <span class="caret">▾</span>
  </div>
  <div class="profile-dropdown" id="profileDropdown">
    <div class="dropdown-item disabled" id="userRoleDisplay"></div>
    <div class="dropdown-divider"></div>
    <div class="dropdown-item" onclick="logout()"> Sign Out</div>
  </div>
</div>
      </div>

      <div class="records-box">

        <div class="add-patient">
          <input type="text" id="patientName" placeholder="Patient name">
          <input type="number" id="patientAge" placeholder="Age">
          <input type="text" id="patientPhone" placeholder="Phone number">
          <button id="addPatientBtn">Add Patient</button>
        </div>

        <input type="text" id="searchBox" placeholder="🔍 Search patients...">

        <table id="patientsTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Phone</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="patientsBody">
            <!-- Patient rows added here by JavaScript -->
          </tbody>
        </table>

      </div>

    </div>
  </div>

<script src="auth.js"></script>
  <script src="records.js"></script>
</body>
</html>
