
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KAROL'S SCENTS - Login</title>

  <link rel="stylesheet" href="style.css">

  <!-- Website icon -->
  <link rel="icon" type="image/png" href="LOGO.png">

  <!-- iPhone home-screen icon -->
  <link rel="apple-touch-icon" href="LOGO.png">

  <!-- Android installation settings -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#214E3D">
</head>

<body>

  <div class="login-box">
    
<img
  src="a_clean_minimal_high_resolution_graphic_branding.png"
  alt="KAROL'S SCENTS logo"
  class="brand-logo"
>
<p>Sign in to your account</p>
    <input type="text" id="phone" placeholder="Phone number">

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password">

      <span id="togglePassword" role="button" tabindex="0"
            aria-label="Show password" title="Show password">

        <!-- Eye icon: show password -->
        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg"
             width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>

        <!-- Eye-off icon: hide password -->
        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg"
             width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             style="display: none;">
          <path d="M3 3l18 18"/>
          <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
          <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a13.3 13.3 0 0 1-4 4.8"/>
          <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"/>
        </svg>

      </span>
    </div>

    <button id="loginBtn">Sign In</button>
    <p id="errorMsg" style="color: red; margin-top: 10px; display: none;"></p>
  </div>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");

    function togglePasswordVisibility() {
      const showPassword = passwordInput.type === "password";

      passwordInput.type = showPassword ? "text" : "password";
      eyeOpen.style.display = showPassword ? "none" : "block";
      eyeClosed.style.display = showPassword ? "block" : "none";

      togglePassword.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
      );
      togglePassword.setAttribute(
        "title",
        showPassword ? "Hide password" : "Show password"
      );
    }

    togglePassword.addEventListener("click", togglePasswordVisibility);

    togglePassword.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        togglePasswordVisibility();
      }
    });
  </script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>


</body>
</html>
