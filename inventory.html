<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#214E3D">
  <title>KAROL'S SCENTS - Inventory</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="inventory.css">
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="offline.js"></script>

  <div class="layout">

    <!-- Sidebar -->
     
    <div class="sidebar">
  <img class="logo-img" src="LOGO.png" alt="Karol's Scents">

  <a href="dashboard.html" title="Home"><div class="nav-item" id="nav-home">
    <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></div></a>

  <a href="pos.html" title="Sales"><div class="nav-item" id="nav-pos">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 7H5"/></svg></div></a>

  <a href="inventory.html" title="Inventory"><div class="nav-item" id="nav-inventory">
      <svg viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
</div></a>

  <a href="receipts.html" title="Receipts"><div class="nav-item" id="nav-receipts">
    <svg viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/></svg></div></a>

  <a href="team.html" title="Team"><div class="nav-item" id="nav-team">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></div></a>
</div>

    <!-- Main content -->
    <div class="main">

      <div class="topbar">
        <h2>Inventory</h2>
     <<div class="profile-menu">
  <div class="profile-trigger" id="profileTrigger">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <span id="userNameDisplay"></span>
    <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="profile-dropdown" id="profileDropdown">
    <div class="dropdown-item disabled" id="userRoleDisplay"></div>
    <div class="dropdown-divider"></div>
    <div class="dropdown-item" onclick="logout()">Sign Out</div>
  </div>
</div>
      </div>

      <div class="inventory-box">

        <div class="add-Products">
            <div class="Products-name-wrap">
              <input type="text" id="ProductsName" placeholder="Search or enter Products name..." autocomplete="off" aria-label="Search or enter Products name">
              <div id="ProductSuggestions" class="Products-Suggestions" role="listbox" hidden></div>
              <small id="ProductsNameHint" class="Products-name-hint" aria-live="polite">Start typing to find an existing Products or insert a new one.</small>
            </div>
            <input type="number" id="ProductsQty" placeholder="Quantity" min="1">
            <input type="number" id="ProductsCostPrice" placeholder="Cost price" min="0">
            <input type="number" id="ProductsellingPrice" placeholder="Selling price" min="0">
            <input type="date" id="ProductsExpiry">
            <button id="addProductsBtn">Add to batch</button>
        </div>

        <!-- Pending batch: items wait here until submitted -->
        <div class="batch-box" id="batchBox" style="display:none;">
          <div class="batch-header">
            <h3>Pending batch (<span id="batchCount">0</span>)</h3>
            <div>
              <button id="clearBatchBtn" class="secondary-btn">Clear</button>
              <button id="submitBatchBtn" class="submit-btn">Submit batch</button>
            </div>
          </div>
          <table class="batch-table">
            <thead>
              <tr>
                <th>Products</th><th>Qty</th><th>Cost</th><th>Selling</th><th>Expiry</th><th>Result</th><th></th>
              </tr>
            </thead>
            <tbody id="batchBody"></tbody>
          </table>
        </div>

        <table id="ProductsTable">
  <thead>
  <tr>
    <th>Products</th>
    <th>Quantity</th>
    <th>Cost Price</th>
    <th>Selling Price</th>
    <th>Expiry Date</th>
    <th>Status</th>
    <th></th>
  </tr>
</thead>
  <tbody id="ProductsBody">
    <!-- Products rows added here by JavaScript -->
  </tbody>
</table>
  </div>
          </div> <!-- inventory-box -->
      </div>   <!-- main -->
    </div>     <!-- layout -->

  <script src="auth.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
