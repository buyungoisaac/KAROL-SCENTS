<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#214E3D">
  <title>KAROL'S SCENTS - Team</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="pos.css">
</head>
<body>
  <div class="layout">
  <!-- Sidebar -->
     
    <div class="sidebar">
  <img class="logo-img" src="LOGO.png" alt="Karol's Scents">

  <a href="dashboard.html" title="Home"><div class="nav-item" id="nav-home">
    <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></div></a>

  <a href="pos.html" title="Sales"><div class="nav-item" id="nav-pos">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 7H5"/></svg></div></a>

  <a href="inventory.html" title="Inventory"><div class="nav-item" id="nav-inventory">
      <svg viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
</div></a>

  <a href="receipts.html" title="Receipts"><div class="nav-item" id="nav-receipts">
    <svg viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/></svg></div></a>

  <a href="team.html" title="Team"><div class="nav-item" id="nav-team">
    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></div></a>
</div>
    <div class="main">
      <div class="topbar">
        <h2>Team</h2>
       <div class="profile-menu">
  <div class="profile-trigger" id="profileTrigger">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <span id="userNameDisplay"></span>
    <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="profile-dropdown" id="profileDropdown">
    <div class="dropdown-item disabled" id="userRoleDisplay"></div>
    <div class="dropdown-divider"></div>
    <div class="dropdown-item" onclick="logout()">Sign Out</div>
  </div>
</div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="users">Users</button>
        <button class="tab" data-tab="company">Company</button>
      </div>

      <div class="pos-box" id="tab-users">
        <div class="add-product">
          <input type="text" id="newName" placeholder="Full name">
          <input type="text" id="newPhone" placeholder="Phone number">
          <input type="password" id="newPassword" placeholder="Password">
          <select id="newRole">
            <option value="member">Member</option>
            <option value="manager">Manager</option>
          </select>
          <button id="addUserBtn">Add User</button>
        </div>

        <table id="usersTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Role</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>

      <div class="pos-box" id="tab-company" hidden>
        <div class="company-form">
          <div class="logo-row">
            <img id="logoPreview" src="LOGO.png" alt="Company logo">
            <div class="logo-actions">
              <label class="btn-secondary" for="logoFile">Change logo</label>
              <input type="file" id="logoFile" accept="image/*" hidden>
              <button type="button" class="btn-secondary" id="logoReset">Use default logo</button>
            </div>
          </div>

          <label>Company name
            <input type="text" id="coName" placeholder="Karol's Scents">
          </label>
          <label>Phone number
            <input type="text" id="coPhone" placeholder="Company phone number">
          </label>
          <label>Address / location (optional)
            <input type="text" id="coAddress" placeholder="e.g. Kampala Road, Shop 12">
          </label>

          <h3>Receipt</h3>
          <label>Line under the company name (optional)
            <input type="text" id="coHeader" placeholder="e.g. Quality perfumes &amp; oils">
          </label>
          <label>Message at the bottom
            <textarea id="coFooter" rows="3" placeholder="Thank you for your purchase!"></textarea>
          </label>
          <label>Currency shown before amounts (optional)
            <input type="text" id="coCurrency" placeholder="e.g. UGX">
          </label>
          <label class="check">
            <input type="checkbox" id="coShowLogo"> Show the logo on printed receipts
          </label>

          <div class="form-actions">
            <button type="button" id="coSave" class="btn-primary">Save changes</button>
            <button type="button" id="coPreview" class="btn-secondary">Print a test receipt</button>
            <span id="coStatus" class="co-status"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="offline.js"></script>
<script src="auth.js"></script>
<script src="company.js"></script>
<script src="team.js"></script>
</body>
</html>
