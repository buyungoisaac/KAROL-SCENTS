    <div class="main">
      <div class="topbar">
        <h2>Team</h2>
       <div class="profile-menu">
  <div class="profile-trigger" id="profileTrigger">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <span id="userNameDisplay"></span>
    <svg class="caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="profile-dropdown" id="profileDropdown">
    <div class="dropdown-item disabled" id="userRoleDisplay"></div>
    <div class="dropdown-divider"></div>
    <div class="dropdown-item" onclick="logout()">Sign Out</div>
  </div>
</div>

      <div class="pos-box">
        <div class="add-product">
          <input type="text" id="newName" placeholder="Full name">
          <input type="text" id="newPhone" placeholder="Phone number">
          <input type="password" id="newPassword" placeholder="Password">
          <select id="newRole">
            <option value="member">Member</option>
            <option value="manager">Manager</option>
          </select>
          <button id="addUserBtn">Add User</button>
        </div>

        <table id="usersTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Role</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="auth.js"></script>
